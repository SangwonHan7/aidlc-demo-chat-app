name: CD - Build, Push & Deploy

# main에 push되면 CI(ci.yml)가 통과한다는 전제로 (1) Backend/Frontend Docker 이미지를 빌드해
# GitHub Container Registry(ghcr.io)에 푸시하고, (2) GitHub 호스팅 러너에서 SSH로 NAS에 접속해
# 최신 이미지를 pull받아 docker compose를 재기동한다.
#
# NAS가 외부에서 SSH로 접근 가능하다는 전제로 SSH 기반 배포를 사용한다(self-hosted runner 설치
# 불필요). 설정 방법은 infra/docker-compose/README.md의 "GitHub Actions로 자동배포 설정(SSH)"
# 섹션 참고 - 필요한 리포지토리 Secrets: NAS_SSH_HOST, NAS_SSH_PORT, NAS_SSH_USER,
# NAS_SSH_PRIVATE_KEY.
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io 이미지 이름은 소문자만 허용되는데 github.repository(owner/repo)에는 대문자가
      # 섞여 있을 수 있어(예: SangwonHan7/...) 그대로 쓰면 빌드가 실패한다 - 소문자로 변환해
      # 이후 스텝에서 재사용.
      - name: Compute lowercase image repo name
        run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # GitHub 러너에 기본 설정된 buildx builder는 driver=docker라서 cache-to/cache-from(type=gha)
      # 같은 캐시 export를 지원하지 않는다("Cache export is not supported for the docker driver"
      # 에러 원인) - docker-container driver를 쓰는 builder를 새로 만들어야 함.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image repo name
        run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_*는 next build 시점에 클라이언트 JS에 정적으로 인라인된다 - 그래서 이 값들을
      # 컨테이너 런타임 환경변수로 나중에 바꿔줄 수 없고, 이미지를 빌드하는 이 시점에 실제 NAS
      # 주소를 알고 있어야 한다. 리포지토리 Settings > Secrets and variables > Actions > Variables
      # 에서 NAS_HOST를 설정해두면(예: 192.168.1.50) 그 값으로 빌드되고, 설정하지 않으면
      # localhost로 빌드되어 NAS 외부에서는 API 호출이 실패한다 - 이 경우 아래 build-args가
      # 그대로 로그에 남으므로 무엇으로 빌드됐는지는 항상 확인 가능하다.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://${{ vars.NAS_HOST || 'localhost' }}:8080
            NEXT_PUBLIC_WS_URL=ws://${{ vars.NAS_HOST || 'localhost' }}:8080/ws
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to NAS via SSH
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    # NAS가 인터넷에서 SSH로 접근 가능하다는 전제. NAS 쪽 사전 준비(.env 생성, SSH 사용자/키
    # 발급)는 infra/docker-compose/README.md의 "GitHub Actions로 자동배포 설정(SSH)" 섹션 참고.
    # 이 job에서 필요한 리포지토리 Secrets: NAS_SSH_HOST, NAS_SSH_PORT, NAS_SSH_USER,
    # NAS_SSH_PRIVATE_KEY.
    #
    # 이미지는 이미 GitHub에서 빌드되어 ghcr.io에 올라가 있으므로, NAS에는 backend/frontend
    # 소스 코드가 전혀 필요 없다 - docker-compose.yml/docker-compose.deploy.yml 두 파일만 있으면
    # 충분하다. 그래서 NAS에 저장소를 git clone해두지 않고, 이 job이 매번 최신 compose 파일을
    # scp로 ~/quickchat-deploy/ 에 복사한 뒤 그 안에서 pull/up만 수행한다(.env는 덮어쓰지 않음).
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image repo name
        run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.NAS_SSH_PORT }}" -H "${{ secrets.NAS_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose files to NAS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.NAS_SSH_PORT }}" \
            "${{ secrets.NAS_SSH_USER }}@${{ secrets.NAS_SSH_HOST }}" "mkdir -p ~/quickchat-deploy"
          scp -i ~/.ssh/deploy_key -P "${{ secrets.NAS_SSH_PORT }}" \
            infra/docker-compose/docker-compose.yml infra/docker-compose/docker-compose.deploy.yml \
            "${{ secrets.NAS_SSH_USER }}@${{ secrets.NAS_SSH_HOST }}:~/quickchat-deploy/"

      # 배포용 .env(~/quickchat-deploy/.env)는 NAS에서 최초 1회 수동으로 만들어둔 뒤 이 워크플로우가
      # 건드리지 않는다(NAS_HOST 등 실제 값이 들어있어 매번 덮어쓰면 안 됨). 헬스체크는 GitHub
      # 호스팅 러너가 아니라 NAS 자신이 localhost로 확인한다 - 8080/3000 포트가 인터넷에 열려있다는
      # 보장이 없기 때문.
      - name: Pull latest images and restart (remote)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.NAS_SSH_PORT }}" \
            "${{ secrets.NAS_SSH_USER }}@${{ secrets.NAS_SSH_HOST }}" bash -s <<EOF
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/quickchat-deploy
            export GHCR_IMAGE_REPO="$GHCR_IMAGE_REPO"
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml pull backend frontend
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-build
            docker image prune -f
            for i in \$(seq 1 15); do
              if curl -sf http://localhost:8080/actuator/health >/dev/null && curl -sf http://localhost:3000 >/dev/null; then
                echo "backend/frontend 정상 응답 확인"
                exit 0
              fi
              echo "아직 준비 안 됨 (\${i}/15), 5초 후 재시도"
              sleep 5
            done
            echo "헬스체크 실패 - docker compose logs로 원인 확인 필요" >&2
            exit 1
          EOF
