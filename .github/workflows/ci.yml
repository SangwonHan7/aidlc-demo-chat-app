name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 이 프로젝트의 백엔드 테스트는 전부 단위/슬라이스 테스트(Mockito mock, @WebMvcTest)와
      # jqwik 속성 테스트로 구성되어 있고 @SpringBootTest 전체 컨텍스트나 Testcontainers를 쓰지
      # 않으므로, 별도 Postgres/Kafka/Redis 서비스 컨테이너 없이 실행 가능하다.
      - name: Build and run tests
        run: ./gradlew build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/test-results/test
          retention-days: 7

  frontend-test:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # NEXT_PUBLIC_*는 빌드 시점에 인라인되므로 CI에서는 문법/타입 오류만 확인하는 목적으로
      # 기본값(localhost)으로 빌드한다. 실제 배포용 이미지 빌드는 cd.yml에서 별도 build-arg로 수행.
      - name: Build (sanity check)
        run: npm run build
