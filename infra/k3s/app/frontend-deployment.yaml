# Frontend Deployment - quickchat-app 네임스페이스
# 리소스: request 256Mi/0.25 vCPU, limit 512Mi/0.5 vCPU, 고정 1레플리카
#
# 중요: NEXT_PUBLIC_API_BASE_URL/NEXT_PUBLIC_WS_URL은 여기(Deployment 런타임 환경변수)에 넣어도
# 아무 효과가 없다 - Next.js가 "use client" 컴포넌트의 NEXT_PUBLIC_* 값을 `next build` 시점에
# 클라이언트 JS로 이미 정적으로 인라인하기 때문(frontend/Dockerfile 주석, deployment-architecture.md
# "환경변수 주입" 참고). 따라서 이 값들은 이미지를 빌드할 때 --build-arg로 넘겨야 하고, 이 매니페스트
# 에는 등장하지 않는다 - 정확한 빌드 명령은 배포 런북 참고.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: quickchat-app
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: quickchat-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
