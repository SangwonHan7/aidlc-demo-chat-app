# Backend Service - NodePort 30081 -> containerPort 8080
# (shared-infrastructure.md "네트워킹 정정" - nginx-ingress 경로 라우팅을 쓰지 않고 NodePort로 직접 노출)
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: quickchat-app
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
