# Backend Deployment - quickchat-app 네임스페이스
# 리소스: request 512Mi/0.5 vCPU, limit 1Gi/1 vCPU, 고정 1레플리카 (NFR Design 결정)
#
# 이미지: 로컬에서 `docker build -t quickchat-backend:latest backend/`로 빌드한 뒤, 이 VM(k3s
# 노드)의 containerd 이미지 스토어로 가져와야 한다(배포 런북 참고) - 별도 레지스트리를 두지 않으므로
# imagePullPolicy를 Never로 둔다.
#
# 환경변수는 backend-config(ConfigMap, 민감하지 않은 값) + backend-secrets(Secret, DB_PASSWORD/
# JWT_SECRET) 두 곳에서 가져온다 - 둘 다 배포 전 직접 생성해야 한다(배포 런북 참고). Vault는
# 클러스터에 존재하지만 이 값들을 Vault에서 가져오지 않는다(data/vault.yaml의 "알려진 제약" 참고).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: quickchat-app
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: quickchat-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
