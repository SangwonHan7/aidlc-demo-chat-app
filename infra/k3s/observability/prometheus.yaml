# Prometheus - quickchat-observability 네임스페이스
# 리소스: request 256Mi/0.25 vCPU, limit 512Mi/0.5 vCPU (짧은 retention)
#
# 경량 구성: Backend의 /actuator/prometheus만 스크랩한다(NFR Requirements Question 4 답변 A -
# Frontend는 커스텀 메트릭 미노출, /api/health는 프로브 용도일 뿐 메트릭 노출용이 아님).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: quickchat-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: quickchat-backend
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["backend.quickchat-app.svc.cluster.local:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: quickchat-observability
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=3d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: quickchat-observability
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
