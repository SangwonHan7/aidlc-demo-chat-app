# Vault (dev 모드) - quickchat-data 네임스페이스
# 리소스: request 128Mi/0.1 vCPU, limit 256Mi/0.25 vCPU
#
# 알려진 제약(투명성 목적, 2026-08-22 배포 작업 중 재확인): 이 프로젝트의 Backend는 실제로
# Vault에서 시크릿을 읽어오도록 구현되어 있지 않다 - `application.yml`을 보면 spring-cloud-vault
# 연동 없이 DB_PASSWORD/JWT_SECRET을 평범한 환경변수(${DB_PASSWORD}, ${JWT_SECRET})로 직접 읽는다.
# Vault는 NFR/Infrastructure Design 단계에서 "시크릿 저장소"로 결정되어 클러스터에 배치되지만,
# 애플리케이션이 실제로 그 값을 가져다 쓰지는 않는다(Backend Deployment는 별도의 Kubernetes
# Secret에서 직접 값을 주입받음, app/backend-deployment.yaml 참고). Vault-Backend 실연동은 이번
# 배포 범위 밖으로 명시적으로 남겨둔다 - 지금은 원래 설계된 클러스터 구성 요소로서만 존재.
#
# dev 모드는 인메모리 저장이라 재시작하면 등록해둔 시크릿이 전부 사라진다(docker-compose와 동일한
# 제약) - 데모/실습 용도로만 적합하고 실제 운영 시크릿 관리로는 부적절하다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: quickchat-data
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          env:
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: vault-credentials
                  key: VAULT_DEV_ROOT_TOKEN_ID
          ports:
            - containerPort: 8200
              name: vault
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: quickchat-data
spec:
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
