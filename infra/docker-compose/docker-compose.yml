# QuickChat 로컬 개발 / NAS RAM 부족 시 축소 운영용 Docker Compose.
# 참고: aidlc-docs/construction/backend/infrastructure-design/deployment-architecture.md
# 현재 NAS(Synology DS925+)는 RAM 20GB로 k3s 운영이 권장되지만, 로컬 개발 편의를 위해 이 파일도 유지한다.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quickchat
      POSTGRES_USER: quickchat
      POSTGRES_PASSWORD: quickchat-local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 2025-08-28부로 Bitnami가 무료 카탈로그(docker.io/bitnami/*)의 기존 이미지를 전부
  # docker.io/bitnamilegacy/*로 이전했다 - bitnami/kafka:3.7은 더 이상 존재하지 않아 "manifest unknown"
  # 오류가 난다(2026-08-21 사용자 인프라 실행 중 실제 발견). bitnamilegacy 저장소는 더 이상 업데이트되지
  # 않는 임시 이전용 스냅샷이라는 경고가 있지만, 태그/환경변수 스킴(KAFKA_CFG_*)이 완전히 동일해 이번
  # 데모 범위에서는 가장 리스크가 적은 수정이다. 장기적으로는 공식 apache/kafka 이미지로 옮기는 것을
  # 고려할 수 있으나 KAFKA_CFG_* -> KAFKA_* 환경변수 전면 재작성이 필요해 이번 라운드 범위를 벗어난다.
  kafka:
    image: bitnamilegacy/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-local-dev-only
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
      - kafka
      - vault
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quickchat
      DB_USERNAME: quickchat
      DB_PASSWORD: quickchat-local-dev-only
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: local-dev-only-jwt-secret-32-bytes-minimum
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"

  # 브라우저가 직접 호출하는 대상이라 build-arg는 backend의 host-published 포트(8080)를 그대로 가리킨다 -
  # "backend"라는 서비스명은 compose 네트워크 내부에서만 resolve되고 사용자의 브라우저에서는 resolve되지
  # 않는다 (Dockerfile 주석 참고: NEXT_PUBLIC_*는 런타임이 아니라 빌드 시점에 인라인됨).
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
