# QuickChat 로컬 개발 및 NAS 배포용 Docker Compose.
# 참고: aidlc-docs/construction/backend/infrastructure-design/deployment-architecture.md
# 2026-08-24: NAS(Synology DS925+) 배포 방식을 k3s에서 docker-compose로 변경(단순성 우선) - 상세 사유는
# deployment-architecture.md, aidlc-docs/audit.md 참고. infra/k3s/의 매니페스트는 참고용으로 남겨둔다.
#
# NAS_HOST: NAS의 실제 LAN IP 또는 호스트명. 같은 디렉터리에 .env 파일을 만들어 설정한다
# (.env.example 참고) - 미설정 시 기본값 localhost로 동작(로컬 개발용).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quickchat
      POSTGRES_USER: quickchat
      POSTGRES_PASSWORD: quickchat-local-dev-only
    # 호스트 포트만 5433으로 바꿨다(컨테이너 내부 포트는 그대로 5432) - NAS에 docker가 아닌
    # 별도 postgres가 이미 5432를 쓰고 있어(kill해도 계속 재기동됨, 실제로 겪은 문제) 충돌 회피.
    # backend는 "postgres:5432"(컨테이너 간 내부 네트워크)로 접속하므로 이 변경과 무관하게 그대로 동작한다 -
    # 이 5433은 NAS에서 psql 등으로 직접 접속하고 싶을 때만 쓰는 포트다.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 2025-08-28부로 Bitnami가 무료 카탈로그(docker.io/bitnami/*)의 기존 이미지를 전부
  # docker.io/bitnamilegacy/*로 이전했다 - bitnami/kafka:3.7은 더 이상 존재하지 않아 "manifest unknown"
  # 오류가 난다(2026-08-21 사용자 인프라 실행 중 실제 발견). bitnamilegacy 저장소는 더 이상 업데이트되지
  # 않는 임시 이전용 스냅샷이라는 경고가 있지만, 태그/환경변수 스킴(KAFKA_CFG_*)이 완전히 동일해 이번
  # 데모 범위에서는 가장 리스크가 적은 수정이다. 장기적으로는 공식 apache/kafka 이미지로 옮기는 것을
  # 고려할 수 있으나 KAFKA_CFG_* -> KAFKA_* 환경변수 전면 재작성이 필요해 이번 라운드 범위를 벗어난다.
  kafka:
    image: bitnamilegacy/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-local-dev-only
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
      - kafka
      - vault
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quickchat
      DB_USERNAME: quickchat
      DB_PASSWORD: quickchat-local-dev-only
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: local-dev-only-jwt-secret-32-bytes-minimum
      CORS_ALLOWED_ORIGIN: http://${NAS_HOST:-localhost}:3000
    # 호스트 포트만 9000으로 바꿨다(컨테이너 내부 포트는 여전히 8080, Spring Boot server.port 그대로) -
    # 공유기에서 8080번 포트포워딩이 막혀 있어(2026-08-24 실제로 겪음) 9000으로 변경. 브라우저/공유기
    # 포트포워딩 규칙은 이제 9000을 봐야 한다 - 아래 frontend build-arg도 9000으로 맞춰져 있다.
    ports:
      - "9000:8080"

  # 브라우저가 직접 호출하는 대상이라 build-arg는 backend의 host-published 포트(9000)를 그대로 가리킨다 -
  # "backend"라는 서비스명은 compose 네트워크 내부에서만 resolve되고 사용자의 브라우저에서는 resolve되지
  # 않는다 (Dockerfile 주석 참고: NEXT_PUBLIC_*는 런타임이 아니라 빌드 시점에 인라인됨).
  # NAS_HOST를 바꾼 뒤에는 반드시 `docker compose up --build frontend`로 재빌드해야 새 값이 반영된다 -
  # 이미 빌드된 이미지의 런타임 환경변수를 바꿔도 클라이언트 JS에는 아무 효과가 없다.
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://${NAS_HOST:-localhost}:9000
        NEXT_PUBLIC_WS_URL: ws://${NAS_HOST:-localhost}:9000/ws
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
