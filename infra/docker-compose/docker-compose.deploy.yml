# docker-compose.yml에 대한 배포용 오버레이 - backend/frontend를 로컬에서 빌드하는 대신
# GitHub Actions CD 워크플로우(.github/workflows/cd.yml)가 ghcr.io에 미리 빌드해둔 이미지를
# 그대로 사용한다.
#
# 사용법 (CD 워크플로우가 NAS의 ~/quickchat-deploy/ 에 이 파일과 docker-compose.yml만 복사해두고
# SSH로 아래 명령을 자동 실행. 수동으로 쓸 때도 NAS에 이 두 파일 + .env만 있으면 되고, backend/
# frontend 소스 코드나 저장소 전체를 clone할 필요는 없다):
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull backend frontend
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-build
#
# GHCR_IMAGE_REPO는 "ghcr.io/<owner>/<repo>" 형식(소문자)이어야 한다 - CD 워크플로우가 자동으로
# 채워서 실행하지만, 수동 실행 시에는 직접 export하거나 .env에 추가해야 한다.
# 예: export GHCR_IMAGE_REPO=ghcr.io/sangwonhan7/aidlc-demo-chat-app
services:
  backend:
    image: ${GHCR_IMAGE_REPO}-backend:latest

  frontend:
    image: ${GHCR_IMAGE_REPO}-frontend:latest
