server:
  port: 8080

spring:
  application:
    name: quickchat-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quickchat}
    username: ${DB_USERNAME:quickchat}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: quickchat-backend
      auto-offset-reset: earliest
    producer:
      retries: 3
      properties:
        retry.backoff.ms: 200

quickchat:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 14
  security:
    login-lock:
      max-attempts: 5
      lock-duration-minutes: 15
  rate-limit:
    messages-per-second: 5
  kafka:
    topic:
      chat-messages: chat-messages

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
